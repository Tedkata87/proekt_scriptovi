<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Bike Help</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Bike Help
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

        </div>

    </nav>

    <div class="form-container">

        <form id="signup-form"
              class="form-card">

            <h1>Sign Up</h1>

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

            <button type="submit">
                Sign Up
            </button>

            <p id="message"></p>

        </form>

    </div>

    <script src="js/signup.js"></script>

</body>

</html>
