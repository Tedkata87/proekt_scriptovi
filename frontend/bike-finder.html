<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bike Finder</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">

            Bike Help

        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="bike-setup.html">Bike Setup</a>

            <a href="login.html">Login</a>

        </div>

    </nav>

    <div class="page-container">

        <div class="form-card">

            <h1>

                Find Your MTB

            </h1>

            <form id="bikeFinderForm">

                <label>Height (cm)</label>
                <input
                    type="number"
                    id="height"
                    placeholder="Enter your height"
                    required><p>

                    </p>

                <label>Weight (kg)</label>
                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight"
                    required><p>

                    </p>

                <label>Terrain</label>
                <select id="terrain">

                    <option value="trail">

                        Trail

                    </option>

                    <option value="enduro">

                        Enduro

                    </option>

                    <option value="downhill">

                        Downhill

                    </option>

                    <option value="freeride">

                        Freeride

                    </option>

                </select>
                <p>
                    
                </p>

                <label>Budget (€)</label>
                <input
                    type="number"
                    id="budget"
                    placeholder="Enter your budget"
                    required><p>
                        
                    </p>

                <label>Additional preferences</label>
                <textarea
                    id="preferences"
                    placeholder="Tell us more about your preferences">
                </textarea>

                <button type="submit">

                    Search Bike

                </button>

            </form>

        </div>

        <div
            id="results"
            class="results-card">

            <h2>

                Search Results

            </h2>

            <div id="recommendation">

                Submit the form to see your bike search results.

            </div>

        </div>

    </div>

    <script src="js/bikeFinder.js"></script>

</body>

</html>
