<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bike Setup</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Bike Help
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="bike-finder.html">
                Bike Finder
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>

    <div class="page-container">

        <div class="form-card">

            <h1>

                MTB Setup Configuration

            </h1>

            <form id="setupForm">

                <label>Rider Height (cm)</label>
                <input
                    type="number"
                    id="rider_height"
                    placeholder="Enter your height"
                    required><p>

                    </p>

                <label>Rider Weight (kg)</label>
                <input
                    type="number"
                    id="rider_weight"
                    placeholder="Enter your weight"
                    required><p>

                    </p>

                <label>Terrain</label>
                <select id="terrain">

                    <option value="trail">
                        Trail
                    </option>

                    <option value="enduro">
                        Enduro
                    </option>

                    <option value="downhill">
                        Downhill
                    </option>

                    <option value="freeride">
                        Freeride
                    </option>

                </select><p>

                </p>

                <label>Bike Type</label>
                <select id="bike_type">

                    <option value="trail bike">
                        Trail Bike
                    </option>

                    <option value="enduro bike">
                        Enduro Bike
                    </option>

                    <option value="downhill bike">
                        Downhill Bike
                    </option>

                    <option value="e-bike">
                        E-Bike
                    </option>

                </select>
                <p>

                </p>

                <label>Brand</label>
                <input
                    type="text"
                    id="brand"
                    placeholder="Enter bike brand"
                    required><p>

                    </p>

                <label>Model</label>
                <input
                    type="text"
                    id="model"
                    placeholder="Enter bike model"
                    required><p>

                    </p>

                <label>Fork (optional)</label>
                <input
                    type="text"
                    id="fork"
                    placeholder="Enter fork model"><p>

                    </p>

                <label>Shock (optional)</label>
                <input
                    type="text"
                    id="shock"
                    placeholder="Enter shock model"><p>

                    </p>

                <label>Frame Size (optional)</label>
                <input
                    type="text"
                    id="frame_size"
                    placeholder="Enter frame size"><p>
                       
                    </p>

                <label>Wheel Size (optional)</label>
                <input
                    type="text"
                    id="wheel_size"
                    placeholder="Enter wheel size"><p>

                    </p>

                <label>Drivetrain (optional)</label>
                <input
                    type="text"
                    id="drivetrain"
                    placeholder="Enter drivetrain"><p>

                    </p>

                <label>Brakes (optional)</label>
                <input
                    type="text"
                    id="brakes"
                    placeholder="Enter brake type"><p>

                    </p>

                <label>Handlebars (optional)</label>
                <input
                    type="text"
                    id="handlebars"
                    placeholder="Enter handlebar type"><p>
                        
                    </p>

                <button type="submit">

                    Save Setup

                </button>

            </form>

        </div>

        <div class="results-card">

            <h2>

                Setup Summary

            </h2>

            <div id="setupResult">

                Submit the form to see your setup configuration.

            </div>

        </div>

    </div>

    <script src="js/bikeSetup.js"></script>

</body>

</html>
